<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务列表 · 第一页自研浏览器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4.5" />
  <link rel="stylesheet" href="theme-premium.css?v=1.0" />
  <style>
    body.booting #login-panel,
    body.booting #tasks-panel { display: none !important; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(700px 380px at 50% -10%, rgba(37,99,235,.14), transparent 60%),
        #f1f5f9;
      color: #64748b;
      font: 14px/1.6 "Manrope", system-ui, sans-serif;
    }
    body:not(.booting) #boot-splash { display: none !important; }
    #boot-splash .boot-spin {
      width: 16px; height: 16px; margin-right: 10px; border-radius: 50%;
      border: 2px solid #e2e8f0; border-top-color: #2563eb;
      animation: boot-spin .8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="booting">
  <div id="boot-splash"><span class="boot-spin"></span>正在恢复会话…</div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">T</span>
        <div class="brand-text">
          <h1 class="brand-name">第一页自研浏览器</h1>
          <p class="sub">Linux · 任务列表 · <code id="api-url">—</code></p>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn ghost" href="/">控制台</a>
        <a class="btn ghost is-active-nav" href="/tasks">任务列表</a>
        <div id="user-chip" class="user-chip hidden"></div>
        <button id="btn-logout" class="btn ghost hidden" type="button">退出</button>
      </div>
    </header>

    <section id="login-panel" class="login-stage">
      <div class="login-card anim-enter">
        <p class="login-eyebrow">需要登录</p>
        <h2 class="login-brand">查看任务列表</h2>
        <p class="hint">请先登录中心账号，再查看本账号可见的坐席 / 拓客任务。</p>
        <form id="login-form" class="login-form" autocomplete="on">
          <label>API 地址
            <input id="api-base" type="text" placeholder="http://127.0.0.1:8080/api" />
          </label>
          <label>用户名
            <input id="username" type="text" autocomplete="username" />
          </label>
          <label>密码
            <input id="password" type="password" autocomplete="current-password" />
          </label>
          <button id="btn-login" class="btn primary block" type="submit">登录</button>
          <p id="login-error" class="error hidden"></p>
        </form>
      </div>
    </section>

    <section id="tasks-panel" class="dashboard hidden">
      <div class="panel anim-fade">
        <div class="panel-head">
          <div>
            <h2>任务列表</h2>
            <p class="panel-desc">客服坐席与 AI 拓客（服务器浏览器白名单）；默认展示全部状态</p>
          </div>
          <div class="panel-actions">
            <button id="btn-refresh" class="btn ghost" type="button">刷新</button>
          </div>
        </div>

        <div class="toolbar-row tasks-toolbar">
          <select id="source-filter" class="input filter-select" title="来源">
            <option value="all">全部（坐席+拓客）</option>
            <option value="work">坐席 / 拓客队列</option>
            <option value="center">AI拓客（中心库）</option>
          </select>
          <select id="status-filter" class="input filter-select" title="状态">
            <option value="all" selected>全部状态</option>
            <option value="pending">待执行 / 运行中</option>
            <option value="running">仅运行中</option>
            <option value="paused">已暂停</option>
            <option value="completed">已完成</option>
            <option value="failed">失败</option>
          </select>
          <input id="keyword" class="input filter-input" type="search" placeholder="搜索任务 / 账号…" />
          <button id="btn-search" class="btn primary" type="button">查询</button>
          <span id="task-meta" class="toolbar-meta">0 条</span>
        </div>
        <p id="queue-banner" class="panel-desc queue-banner">执行队列：加载中…</p>

        <div class="table-scroll">
          <table class="win-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>类型</th>
                <th>状态</th>
                <th>进度</th>
                <th>创建时间</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="task-body">
              <tr><td colspan="8" class="empty">加载中…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pager-bar" id="pager-bar">
          <button type="button" class="btn ghost" id="btn-prev" disabled>上一页</button>
          <span id="pager-label" class="toolbar-meta">第 1 / 1 页</span>
          <button type="button" class="btn ghost" id="btn-next" disabled>下一页</button>
          <select id="page-size" class="input filter-select" title="每页条数">
            <option value="10">10 / 页</option>
            <option value="20" selected>20 / 页</option>
            <option value="50">50 / 页</option>
          </select>
        </div>
      </div>
    </section>
  </div>
  <aside id="log-drawer" class="log-drawer hidden" aria-hidden="true">
    <div class="log-drawer-head">
      <div>
        <h3 id="log-drawer-title">任务日志</h3>
        <p id="log-drawer-sub" class="panel-desc">实时拉取中心库日志（与 Node 同源）</p>
      </div>
      <div class="panel-actions">
        <button type="button" class="btn ghost" id="btn-log-refresh">刷新</button>
        <button type="button" class="btn ghost" id="btn-log-clear">清空日志</button>
        <button type="button" class="btn ghost" id="btn-log-close">关闭</button>
      </div>
    </div>
    <div id="log-drawer-body" class="log-drawer-body">
      <p class="muted">点击「日志」查看执行过程；运行中约每秒自动刷新</p>
    </div>
  </aside>
  <div id="toast-host" aria-live="polite"></div>
  <script src="tasks.js?v=11"></script>
</body>
</html>
