<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第一页自研浏览器 VNC</title>
  <style>
    :root {
      --ink: #0b1220;
      --muted: #7b8799;
      --line: #e4e9f0;
      --accent: #2563eb;
      --accent-deep: #1d4ed8;
      --danger: #e11d48;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1220;
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      height: 48px;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      position: relative;
      z-index: 2;
    }
    .bar::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 2px;
      background: linear-gradient(90deg, #2563eb, #0891b2 40%, #4f46e5 75%, #059669);
      opacity: 0.85;
    }
    .bar strong {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .bar code {
      font-size: 11.5px;
      color: var(--accent-deep);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: ui-monospace, Consolas, monospace;
    }
    .bar a {
      color: var(--accent-deep);
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #dbe3ee;
      background: #fff;
      transition: background .15s, border-color .15s;
    }
    .bar a:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }
    #screen {
      position: absolute;
      inset: 48px 0 0 0;
      background: #000;
    }
    #status {
      margin-left: auto;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }
    #status.ok { color: #047857; }
    #status.ok::before {
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }
    #status.err { color: var(--danger); }
    #status.err::before {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.18);
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/">← 控制台</a>
    <strong>远程查看</strong>
    <code id="pid">—</code>
    <span id="status">连接中…</span>
  </div>
  <div id="screen"></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '';
    document.getElementById('pid').textContent = id ? id.slice(0, 16) + '…' : '缺 id';
    const status = document.getElementById('status');

    if (!id) {
      status.textContent = '缺少环境 id';
      status.classList.add('err');
    } else {
      try {
        let RFB;
        try {
          ({ default: RFB } = await import('/vendor/novnc/lib/rfb.js'));
          status.textContent = '本地 noVNC…';
        } catch {
          ({ default: RFB } = await import('https://cdn.jsdelivr.net/npm/@novnc/novnc@1.5.0/lib/rfb.js'));
          status.textContent = 'CDN noVNC…';
        }
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const token = localStorage.getItem('tkswarm_lb_token') || '';
        const qs = token ? `?token=${encodeURIComponent(token)}` : '';
        const url = `${proto}://${location.host}/vnc-ws/${encodeURIComponent(id)}${qs}`;
        const rfb = new RFB(document.getElementById('screen'), url);
        rfb.scaleViewport = true;
        rfb.resizeSession = true;
        rfb.addEventListener('connect', () => {
          status.textContent = '已连接';
          status.classList.remove('err');
          status.classList.add('ok');
        });
        rfb.addEventListener('disconnect', (e) => {
          status.textContent = e.detail?.clean ? '已断开' : '连接失败 / 已断开';
          status.classList.remove('ok');
          status.classList.add('err');
        });
        rfb.addEventListener('credentialsrequired', () => {
          const pw = prompt('VNC 密码（若服务端设置了 TKSWARM_VNC_PASSWORD）') || '';
          rfb.sendCredentials({ password: pw });
        });
      } catch (e) {
        status.textContent = e.message || 'noVNC 加载失败（请 npm i @novnc/novnc 或检查网络）';
        status.classList.add('err');
      }
    }
  </script>
</body>
</html>
